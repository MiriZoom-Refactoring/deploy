---
all:
  children:
    web:
      hosts:
        mirizoom_web:
          ansible_host: "{{ lookup('ansible.builtin.env', 'WEB_HOST') }}"
    app:
      hosts:
        mirizoom_app:
          ansible_host: "{{ lookup('ansible.builtin.env', 'APP_HOST') }}"
  vars:
    ansible_user: "{{ lookup('ansible.builtin.env', 'SSH_USER') }}"
    ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'SSH_KEY') }}"
