---
- name: Require Amazon Linux 2023 x86_64
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Amazon'
      - ansible_facts.distribution_version == '2023'
      - ansible_facts.architecture == 'x86_64'
    fail_msg: Create Amazon Linux 2023 x86_64 instances for this practice.

- name: Install Docker and managed-node prerequisites
  ansible.builtin.dnf:
    name: [docker, python3, util-linux]
    state: present
    update_cache: true

- name: Create the Docker CLI plugin directory
  ansible.builtin.file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    mode: '0755'

- name: Install the pinned Docker Compose CLI plugin
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/{{ compose_version }}/docker-compose-linux-x86_64"
    checksum: "sha256:https://github.com/docker/compose/releases/download/{{ compose_version }}/docker-compose-linux-x86_64.sha256"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    mode: '0755'

- name: Install Buildx for the Jenkins host image build
  ansible.builtin.get_url:
    url: "https://github.com/docker/buildx/releases/download/{{ buildx_version }}/buildx-{{ buildx_version }}.linux-amd64"
    checksum: "sha256:https://github.com/docker/buildx/releases/download/{{ buildx_version }}/checksums.txt"
    dest: /usr/local/lib/docker/cli-plugins/docker-buildx
    mode: '0755'
  when: inventory_hostname in groups['jenkins']

- name: Start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Allow the EC2 account to run Docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Read SSH host public key through the verified bootstrap connection
  ansible.builtin.slurp:
    src: /etc/ssh/ssh_host_ed25519_key.pub
  register: ssh_host_key
